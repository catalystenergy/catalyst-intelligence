<html lang="en">
<head>

<title>Opportunity Scanner — Catalyst Energy</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #070b14; --surface: #0d1424; --card: #111827; --card-hover: #151f30;
  --border: #1e293b; --border-light: #2d3f55;
  --text: #e2e8f0; --text-muted: #64748b; --text-dim: #94a3b8;
  --green: #10b981; --green-bg: rgba(16,185,129,.12); --green-border: rgba(16,185,129,.3);
  --amber: #f59e0b; --amber-bg: rgba(245,158,11,.12); --amber-border: rgba(245,158,11,.3);
  --blue: #3b82f6;  --blue-bg: rgba(59,130,246,.12);  --blue-border: rgba(59,130,246,.3);
  --red:  #ef4444;  --red-bg: rgba(239,68,68,.10);    --red-border: rgba(239,68,68,.22);
  --purple: #8b5cf6; --purple-bg: rgba(139,92,246,.12);
  --slate-bg: rgba(71,85,105,.18);
}
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size:14px; line-height:1.5; min-height:100vh; }

/* ── HEADER ── */
header { background:var(--surface); border-bottom:1px solid var(--border); padding:13px 24px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:100; }
.logo { width:34px; height:34px; background:linear-gradient(135deg,#1d4ed8,#10b981); border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; flex-shrink:0; }
.header-title h1 { font-size:15px; font-weight:600; }
.header-title p  { font-size:11px; color:var(--text-muted); margin-top:1px; }
.header-right    { margin-left:auto; text-align:right; }
.ver-badge { font-size:10px; background:var(--card); border:1px solid var(--border); padding:3px 8px; border-radius:4px; color:var(--text-muted); font-family:'SF Mono','Fira Code',monospace; }
.ver-date  { font-size:10px; color:var(--text-muted); margin-top:3px; }

/* ── STATS BAR ── */
.stats-bar { display:flex; background:var(--surface); border-bottom:1px solid var(--border); gap:1px; }
.stat-item { flex:1; background:var(--bg); padding:12px 20px; display:flex; align-items:center; gap:12px; }
.stat-dot  { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.stat-num  { font-size:22px; font-weight:700; line-height:1; }
.stat-label{ font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }

/* ── MAIN TABS ── */
.main-nav { display:flex; background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px; gap:2px; }
.main-tab { background:none; border:none; color:var(--text-muted); padding:12px 18px; font-size:13px; cursor:pointer; border-bottom:2px solid transparent; font-family:inherit; transition:color .15s,border-color .15s; white-space:nowrap; }
.main-tab:hover  { color:var(--text); }
.main-tab.active { color:var(--blue); border-bottom-color:var(--blue); }

/* ── PANELS ── */
.panel { display:none; padding:24px; }
.panel.active { display:block; }

/* ── SUB-TABS ── */
.sub-nav { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.sub-tab { background:var(--card); border:1px solid var(--border); color:var(--text-muted); padding:7px 14px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; transition:all .15s; }
.sub-tab:hover  { border-color:var(--border-light); color:var(--text); }
.sub-tab.active { background:var(--blue-bg); border-color:var(--blue-border); color:var(--blue); }
.badge { font-size:11px; font-weight:600; padding:1px 6px; border-radius:10px; }
.badge.green { background:var(--green-bg); color:var(--green); }
.badge.amber { background:var(--amber-bg); color:var(--amber); }
.badge.blue  { background:var(--blue-bg);  color:var(--blue);  }
.badge.grey  { background:var(--slate-bg); color:var(--text-muted); }

/* ── SOURCE GRID ── */
.sources-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; }
.sources-grid.hidden { display:none; }
.cat-header { grid-column:1/-1; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); padding:12px 0 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.cat-header:first-child { margin-top:0; padding-top:0; }

/* ── SOURCE CARD ── */
.src-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:13px 15px; transition:border-color .15s,background .15s; display:flex; flex-direction:column; gap:8px; }
.src-card:hover { border-color:var(--border-light); background:var(--card-hover); }
.src-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.src-name { font-weight:600; font-size:13px; color:var(--text); }
.src-id   { font-size:10px; color:var(--text-muted); font-family:'SF Mono','Fira Code',monospace; margin-top:2px; }
.src-badges { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.sbadge { font-size:10px; font-weight:600; padding:2px 7px; border-radius:4px; text-transform:uppercase; letter-spacing:.04em; border:1px solid transparent; }
.sb-active { background:var(--green-bg); color:var(--green); border-color:var(--green-border); }
.sb-manual { background:var(--amber-bg); color:var(--amber); border-color:var(--amber-border); }
.sb-parked { background:var(--slate-bg); color:var(--text-muted); border-color:var(--border); }
.sb-pipe   { background:var(--blue-bg);  color:var(--blue);  border-color:var(--blue-border); }
.sb-high   { background:rgba(239,68,68,.12); color:#f87171; border-color:rgba(239,68,68,.28); }
.sb-medium { background:var(--amber-bg); color:var(--amber); border-color:var(--amber-border); }
.sb-low    { background:var(--slate-bg); color:var(--text-muted); border-color:var(--border); }
.src-tags  { display:flex; flex-wrap:wrap; gap:4px; }
.tag { font-size:11px; padding:2px 7px; border-radius:4px; font-family:'SF Mono','Fira Code',monospace; }
.t-api  { background:rgba(99,102,241,.15);  color:#a5b4fc; }
.t-rss  { background:rgba(245,158,11,.12);  color:#fbbf24; }
.t-html { background:rgba(16,185,129,.11);  color:#6ee7b7; }
.t-pw   { background:rgba(139,92,246,.12);  color:#c4b5fd; }
.t-man  { background:rgba(245,158,11,.10);  color:#fbbf24; }
.t-day  { background:rgba(239,68,68,.10);   color:#fca5a5; }
.t-wk   { background:rgba(71,85,105,.20);   color:#94a3b8; }
.t-mon  { background:rgba(71,85,105,.14);   color:#64748b; }
.t-t1   { background:rgba(16,185,129,.09);  color:#6ee7b7; }
.t-t2   { background:rgba(139,92,246,.09);  color:#c4b5fd; }
.t-t3   { background:rgba(245,158,11,.09);  color:#fbbf24; }
.t-sig  { background:rgba(99,102,241,.10);  color:#a5b4fc; font-size:10px; }
.src-geo  { font-size:12px; color:var(--text-dim); }
.src-url  { font-size:11px; color:#60a5fa; font-family:monospace; opacity:.8; }
.src-note { font-size:11px; color:var(--text-muted); line-height:1.45; border-top:1px solid var(--border); padding-top:8px; }
.src-reason { font-size:11px; padding:3px 8px; border-radius:4px; background:rgba(239,68,68,.08); color:#fca5a5; border:1px solid rgba(239,68,68,.15); }

/* ── KEYWORDS ── */
.kw-grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
.kw-section { margin-bottom:28px; }
.kw-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.kw-head h3 { font-size:13px; font-weight:600; }
.kw-count { font-size:11px; color:var(--text-muted); background:var(--card); border:1px solid var(--border); padding:1px 7px; border-radius:10px; }
.kw-desc  { font-size:11px; color:var(--text-muted); margin-left:auto; max-width:280px; text-align:right; }
.pill-cloud { display:flex; flex-wrap:wrap; gap:5px; }
.pill { font-size:12px; padding:4px 10px; border-radius:20px; border:1px solid transparent; line-height:1.3; }
.p-hi   { background:rgba(245,158,11,.11); color:#fbbf24; border-color:rgba(245,158,11,.25); }
.p-sec  { background:rgba(16,185,129,.09); color:#6ee7b7; border-color:rgba(16,185,129,.2); }
.p-sig  { background:rgba(59,130,246,.09); color:#93c5fd; border-color:rgba(59,130,246,.2); }
.p-exc  { background:rgba(239,68,68,.07);  color:#fca5a5; border-color:rgba(239,68,68,.15); font-size:11px; }
.p-ctry { background:rgba(71,85,105,.18);  color:#94a3b8; border-color:var(--border); font-size:11px; }
.p-tru  { background:rgba(99,102,241,.11); color:#a5b4fc; border-color:rgba(99,102,241,.25); }

/* ── LIFECYCLE ── */
.lc-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:32px; }
.phase-card { border-radius:8px; border:1px solid; overflow:hidden; }
.phase-hdr  { padding:10px 12px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.phase-num  { font-size:20px; font-weight:800; display:block; line-height:1; margin-bottom:3px; opacity:.85; }
.phase-lbl  { display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.phase-body { padding:8px 10px; display:flex; flex-direction:column; gap:5px; }
.sig-item   { font-size:11px; color:var(--text-dim); line-height:1.3; padding:4px 8px; background:rgba(255,255,255,.03); border-radius:4px; border-left:2px solid; }
.phase-srcs { padding:6px 10px 10px; border-top:1px solid rgba(255,255,255,.05); }
.phase-srcs-lbl  { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px; }
.phase-srcs-list { display:flex; flex-wrap:wrap; gap:3px; }
.src-chip { font-size:10px; padding:1px 5px; background:rgba(255,255,255,.05); color:var(--text-muted); border-radius:3px; }
.ph1 { border-color:rgba(99,102,241,.4); }   .ph1 .phase-hdr { background:rgba(99,102,241,.2);  color:#a5b4fc; } .ph1 .sig-item { border-color:rgba(99,102,241,.55); }
.ph2 { border-color:rgba(139,92,246,.4); }   .ph2 .phase-hdr { background:rgba(139,92,246,.2); color:#c4b5fd; } .ph2 .sig-item { border-color:rgba(139,92,246,.55); }
.ph3 { border-color:rgba(6,182,212,.4); }    .ph3 .phase-hdr { background:rgba(6,182,212,.2);  color:#67e8f9; } .ph3 .sig-item { border-color:rgba(6,182,212,.55); }
.ph4 { border-color:rgba(16,185,129,.4); }   .ph4 .phase-hdr { background:rgba(16,185,129,.2); color:#6ee7b7; } .ph4 .sig-item { border-color:rgba(16,185,129,.55); }
.ph5 { border-color:rgba(245,158,11,.4); }   .ph5 .phase-hdr { background:rgba(245,158,11,.2); color:#fcd34d; } .ph5 .sig-item { border-color:rgba(245,158,11,.55); }
.ph6 { border-color:rgba(249,115,22,.4); }   .ph6 .phase-hdr { background:rgba(249,115,22,.2); color:#fdba74; } .ph6 .sig-item { border-color:rgba(249,115,22,.55); }
.ph7 { border-color:rgba(71,85,105,.4); }    .ph7 .phase-hdr { background:rgba(71,85,105,.22); color:#94a3b8; } .ph7 .sig-item { border-color:rgba(71,85,105,.55); }
.ref-table { width:100%; border-collapse:collapse; font-size:12px; }
.ref-table th { padding:9px 14px; text-align:left; color:var(--text-muted); font-weight:600; background:var(--surface); border-bottom:1px solid var(--border); }
.ref-table td { padding:7px 14px; border-bottom:1px solid var(--border); color:var(--text-dim); }
.ref-table td.pc { vertical-align:top; border-right:1px solid var(--border); }
.ref-table td.lc { vertical-align:top; border-right:1px solid var(--border); }
.callout { background:rgba(245,158,11,.07); border:1px solid rgba(245,158,11,.25); border-radius:8px; padding:14px 18px; margin-bottom:22px; display:flex; align-items:flex-start; gap:12px; }
.callout-icon  { font-size:20px; flex-shrink:0; line-height:1.3; }
.callout-title { font-size:13px; font-weight:600; color:#fbbf24; margin-bottom:4px; }
.callout-body  { font-size:12px; color:var(--text-dim); line-height:1.5; }
@media(max-width:1100px){.lc-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.lc-grid{grid-template-columns:repeat(2,1fr)}.kw-grid{grid-template-columns:1fr}}
</style>
</head>

// ── NAV ────────────────────────────────────────────────────────────────────
function showPanel(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
}
function showSrc(type, btn) {
  ['auto-grid','manual-grid','pipeline-grid','parked-grid'].forEach(id =>
    document.getElementById(id).classList.add('hidden'));
  document.querySelectorAll('#panel-sources .sub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(type + '-grid').classList.remove('hidden');
  if (btn) btn.classList.add('active');
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function mTag(m) {
  const map = { 'API':'t-api','API POST':'t-api','RSS':'t-rss','RSS + HTML':'t-rss',
    'HTML':'t-html','HTML POST':'t-html','HTML (WordPress)':'t-html','HTML (WP)':'t-html',
    'HTML + RSS':'t-rss','HTML/RSS':'t-rss','Playwright':'t-pw','Manual':'t-man','Unknown (probe)':'t-man' };
  return `<span class="tag ${map[m]||'t-html'}">${m}</span>`;
}
function cTag(c) {
  return `<span class="tag ${c==='daily'?'t-day':c==='weekly'?'t-wk':'t-mon'}">${c}</span>`;
}
function tTag(t) {
  const s = String(t);
  return `<span class="tag ${s.startsWith('1')?'t-t1':s.startsWith('2')?'t-t2':'t-t3'}">T${t}</span>`;
}
function sTag(s) { return s?`<span class="tag t-sig">${s}</span>`:''; }
function card(html) { return `<div class="src-card">${html}</div>`; }

function srcBody(s, badgeCls, badgeLbl) {
  return `
    <div class="src-head">
      <div><div class="src-name">${s.name}</div><div class="src-id">${s.id}</div></div>
      <div class="src-badges"><span class="sbadge ${badgeCls}">${badgeLbl}</span></div>
    </div>
    <div class="src-tags">${mTag(s.method)}${cTag(s.cadence)}${tTag(s.tier)}${sTag(s.signal||'')}</div>
    <div class="src-geo">📍 ${s.geo||''}</div>
    <div class="src-note">${s.note||''}</div>`;
}
