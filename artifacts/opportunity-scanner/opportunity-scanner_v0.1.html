<head>

<title>Opportunity Scanner — Catalyst Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --c-bg:            #F7F4F0;
  --c-surface:       #FFFFFF;
  --c-surface-hover: #FDFAF7;
  --c-surface-active:#FEF7F2;
  --c-border:        #E8E2DA;
  --c-border-active: #E8D8C8;
  --c-border-soft:   #F0EBE6;
  --c-text-primary:  #1A1714;
  --c-text-body:     #5C5248;
  --c-text-secondary:#7A6E68;
  --c-text-muted:    #9C8E84;
  --c-text-faint:    #C8B8AC;
  --c-accent:        #E8873A;
  --c-accent-dark:   #D4732A;
  --c-signal:        #A8C0CC;
  --c-tag-policy-bg: #EEF4EB; --c-tag-policy-fg: #6A8C5A;
  --c-tag-plan-bg:   #EBF4F2; --c-tag-plan-fg:   #4A8478;
  --c-tag-prep-bg:   #EBF0F8; --c-tag-prep-fg:   #4A6A9C;
  --c-tag-study-bg:  #F2EBF8; --c-tag-study-fg:  #7A5A9C;
  --c-tag-proc-bg:   #FEF0E6; --c-tag-proc-fg:   #C47030;
  --c-tag-fin-bg:    #FCEAE8; --c-tag-fin-fg:    #B85040;
  --c-tag-ops-bg:    #F4F2E8; --c-tag-ops-fg:    #7A7848;
  --f-body: 'Lato', sans-serif;
  --f-mono: 'JetBrains Mono', monospace;
  --radius-tag: 2px;
}
html { font-size: 16px; }
body { background: var(--c-bg); color: var(--c-text-primary); font-family: var(--f-body); min-height: 100vh; }

/* ── HEADER ── */
header {
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  border-top: 3px solid var(--c-accent);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100;
}
.logo {
  width: 36px; height: 36px;
  border: 2px solid var(--c-accent);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-body); font-weight: 900; font-size: 11px;
  color: var(--c-accent); letter-spacing: 0.05em; flex-shrink: 0;
}
.header-title h1 { font-family: var(--f-body); font-size: 15px; font-weight: 900; letter-spacing: -0.01em; color: var(--c-text-primary); }
.header-title p  { font-family: var(--f-mono); font-size: 11px; color: var(--c-text-muted); margin-top: 2px; letter-spacing: 0.08em; text-transform: uppercase; }
.header-right { margin-left: auto; text-align: right; }
.ver-badge { font-family: var(--f-mono); font-size: 10px; background: var(--c-bg); border: 1px solid var(--c-border); padding: 3px 8px; color: var(--c-text-muted); letter-spacing: 0.06em; }
.ver-date  { font-family: var(--f-mono); font-size: 10px; color: var(--c-text-faint); margin-top: 3px; letter-spacing: 0.04em; }

/* ── STATS BAR ── */
.stats-bar { display: flex; border-bottom: 1px solid var(--c-border); gap: 1px; background: var(--c-border); }
.stat-item { flex: 1; background: var(--c-bg); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
.stat-dot  { width: 6px; height: 6px; flex-shrink: 0; }
.stat-num  { font-family: var(--f-body); font-size: 22px; font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
.stat-label{ font-family: var(--f-mono); font-size: 10px; color: var(--c-text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }

/* ── MAIN TABS ── */
.main-nav { display: flex; background: var(--c-surface); border-bottom: 1px solid var(--c-border); padding: 0 24px; gap: 0; }
.main-tab { background: none; border: none; color: var(--c-text-muted); padding: 13px 20px; font-family: var(--f-body); font-size: 13px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; letter-spacing: 0.02em; transition: color .15s, border-color .15s; white-space: nowrap; }
.main-tab:hover  { color: var(--c-text-primary); }
.main-tab.active { color: var(--c-accent); border-bottom-color: var(--c-accent); }

/* ── PANELS ── */
.panel { display: none; padding: 24px; }
.panel.active { display: block; }

/* ── SUB-TABS ── */
.sub-nav { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.sub-tab {
  background: var(--c-surface); border: 1px solid var(--c-border);
  color: var(--c-text-secondary); padding: 6px 14px;
  font-family: var(--f-body); font-size: 12px; font-weight: 700;
  letter-spacing: 0.04em; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all .15s;
}
.sub-tab:hover  { border-color: var(--c-accent); color: var(--c-text-primary); }
.sub-tab.active { background: var(--c-surface-active); border-color: var(--c-accent); color: var(--c-accent); }
.badge { font-family: var(--f-mono); font-size: 10px; font-weight: 500; padding: 1px 6px; letter-spacing: 0.06em; }
.badge.green { background: var(--c-tag-policy-bg); color: var(--c-tag-policy-fg); }
.badge.amber { background: var(--c-tag-proc-bg);   color: var(--c-tag-proc-fg); }
.badge.blue  { background: var(--c-tag-prep-bg);   color: var(--c-tag-prep-fg); }
.badge.grey  { background: var(--c-tag-ops-bg);    color: var(--c-tag-ops-fg); }

/* ── SOURCE GRID ── */
.sources-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
.sources-grid.hidden { display: none; }
.cat-header { grid-column: 1/-1; font-family: var(--f-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--c-text-muted); padding: 14px 0 8px; border-bottom: 1px solid var(--c-border); display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.cat-header:first-child { margin-top: 0; padding-top: 0; }

/* ── SOURCE CARD ── */
.src-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-top: 2px solid var(--c-accent);
  padding: 12px 14px;
  transition: all 0.18s ease;
  display: flex; flex-direction: column; gap: 8px;
}
.src-card:hover { background: var(--c-surface-hover); border-color: var(--c-border-active); border-top-color: var(--c-accent-dark); box-shadow: 0 2px 8px rgba(232,135,58,0.08); }
.src-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.src-name { font-family: var(--f-body); font-weight: 700; font-size: 13px; color: var(--c-text-primary); line-height: 1.3; }
.src-id   { font-family: var(--f-mono); font-size: 10px; color: var(--c-text-muted); margin-top: 2px; letter-spacing: 0.06em; }
.src-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.sbadge { font-family: var(--f-mono); font-size: 10px; font-weight: 500; padding: 2px 6px; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid transparent; }
.sb-active { background: var(--c-tag-policy-bg); color: var(--c-tag-policy-fg); border-color: #BDD4B0; }
.sb-manual { background: var(--c-tag-proc-bg); color: var(--c-tag-proc-fg); border-color: #F0C8A0; }
.sb-parked { background: var(--c-tag-ops-bg); color: var(--c-tag-ops-fg); border-color: #DDD8C0; }
.sb-pipe   { background: var(--c-tag-prep-bg); color: var(--c-tag-prep-fg); border-color: #B8C8E8; }
.sb-high   { background: var(--c-tag-fin-bg); color: var(--c-tag-fin-fg); border-color: #E8B0A8; }
.sb-medium { background: var(--c-tag-proc-bg); color: var(--c-tag-proc-fg); border-color: #F0C8A0; }
.sb-low    { background: var(--c-tag-ops-bg); color: var(--c-tag-ops-fg); border-color: #DDD8C0; }

.src-tags  { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; padding: 2px 6px; border-radius: var(--radius-tag); display: inline-block; }
.t-api  { background: var(--c-tag-prep-bg);   color: var(--c-tag-prep-fg); }
.t-rss  { background: var(--c-tag-policy-bg); color: var(--c-tag-policy-fg); }
.t-html { background: var(--c-tag-plan-bg);   color: var(--c-tag-plan-fg); }
.t-pw   { background: var(--c-tag-study-bg);  color: var(--c-tag-study-fg); }
.t-man  { background: var(--c-tag-ops-bg);    color: var(--c-tag-ops-fg); }
.t-day  { background: var(--c-tag-fin-bg);    color: var(--c-tag-fin-fg); }
.t-wk   { background: var(--c-tag-proc-bg);   color: var(--c-tag-proc-fg); }
.t-mon  { background: var(--c-tag-ops-bg);    color: var(--c-tag-ops-fg); }
.t-t1   { background: var(--c-tag-policy-bg); color: var(--c-tag-policy-fg); }
.t-t2   { background: var(--c-tag-study-bg);  color: var(--c-tag-study-fg); }
.t-t3   { background: var(--c-tag-ops-bg);    color: var(--c-tag-ops-fg); }
.t-sig  { background: var(--c-tag-plan-bg);   color: var(--c-tag-plan-fg); font-size: 10px; }

.src-geo  { font-family: var(--f-mono); font-size: 11px; color: var(--c-text-secondary); letter-spacing: 0.04em; }
.src-url  { font-family: var(--f-mono); font-size: 10px; color: var(--c-accent); letter-spacing: 0.02em; word-break: break-all; }
.src-note { font-family: var(--f-body); font-size: 12px; color: var(--c-text-body); line-height: 1.5; border-top: 1px solid var(--c-border-soft); padding-top: 8px; }
.src-reason { font-family: var(--f-mono); font-size: 10px; padding: 3px 8px; background: var(--c-tag-fin-bg); color: var(--c-tag-fin-fg); letter-spacing: 0.06em; text-transform: uppercase; }

/* ── KEYWORDS ── */
.kw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.kw-section { margin-bottom: 28px; }
.kw-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--c-border); }
.kw-head h3 { font-family: var(--f-body); font-size: 13px; font-weight: 900; letter-spacing: -0.01em; color: var(--c-text-primary); }
.kw-count { font-family: var(--f-mono); font-size: 10px; color: var(--c-text-muted); background: var(--c-bg); border: 1px solid var(--c-border); padding: 1px 7px; letter-spacing: 0.06em; }
.kw-desc  { font-family: var(--f-mono); font-size: 10px; color: var(--c-text-muted); margin-left: auto; max-width: 260px; text-align: right; letter-spacing: 0.04em; }
.pill-cloud { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-family: var(--f-mono); font-size: 11px; padding: 3px 9px; letter-spacing: 0.06em; border: 1px solid transparent; line-height: 1.4; }
.p-hi   { background: var(--c-tag-proc-bg); color: var(--c-tag-proc-fg); border-color: #F0C8A0; }
.p-sec  { background: var(--c-tag-plan-bg); color: var(--c-tag-plan-fg); border-color: #B0D4CC; }
.p-sig  { background: var(--c-tag-prep-bg); color: var(--c-tag-prep-fg); border-color: #B8C8E8; }
.p-exc  { background: var(--c-tag-fin-bg);  color: var(--c-tag-fin-fg);  border-color: #E8B0A8; font-size: 10px; }
.p-ctry { background: var(--c-tag-ops-bg);  color: var(--c-tag-ops-fg);  border-color: #DDD8C0; font-size: 10px; }
.p-tru  { background: var(--c-tag-study-bg);color: var(--c-tag-study-fg);border-color: #C8B0E0; }

/* ── LIFECYCLE ── */
.lc-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin-bottom: 32px; }
.phase-card { border: 1px solid var(--c-border); background: var(--c-surface); overflow: hidden; }
.phase-hdr  { padding: 10px 12px; font-family: var(--f-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; border-top: 3px solid; }
.phase-num  { font-family: var(--f-body); font-size: 22px; font-weight: 900; display: block; line-height: 1; margin-bottom: 2px; letter-spacing: -0.03em; }
.phase-lbl  { display: block; font-family: var(--f-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }
.phase-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.sig-item   { font-family: var(--f-body); font-size: 11px; color: var(--c-text-body); line-height: 1.35; padding: 5px 8px; background: var(--c-bg); border-left: 2px solid; }
.phase-srcs { padding: 6px 10px 10px; border-top: 1px solid var(--c-border-soft); }
.phase-srcs-lbl  { font-family: var(--f-mono); font-size: 9px; color: var(--c-text-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
.phase-srcs-list { display: flex; flex-wrap: wrap; gap: 3px; }
.src-chip { font-family: var(--f-mono); font-size: 10px; padding: 1px 5px; background: var(--c-bg); color: var(--c-text-muted); border: 1px solid var(--c-border); letter-spacing: 0.04em; }
.ph1 .phase-hdr { border-top-color: #8A84CC; color: #5A5490; background: #F2F0FA; }  .ph1 .sig-item { border-color: #B8B4E0; }
.ph2 .phase-hdr { border-top-color: #9A7ACC; color: #6A4A94; background: #F4F0FA; }  .ph2 .sig-item { border-color: #C4B0E0; }
.ph3 .phase-hdr { border-top-color: #5AAABB; color: #3A7888; background: #EEF5F8; }  .ph3 .sig-item { border-color: #8ABEC8; }
.ph4 .phase-hdr { border-top-color: #6A8C5A; color: #4A7040; background: #EEF4EB; }  .ph4 .sig-item { border-color: #8AB87A; }
.ph5 .phase-hdr { border-top-color: var(--c-accent); color: var(--c-accent-dark); background: #FEF0E6; }  .ph5 .sig-item { border-color: var(--c-accent); }
.ph6 .phase-hdr { border-top-color: #CC6A4A; color: #A04830; background: #FCEAE0; }  .ph6 .sig-item { border-color: #E09070; }
.ph7 .phase-hdr { border-top-color: #8A8070; color: #5A5248; background: #F4F2E8; }  .ph7 .sig-item { border-color: #B8B0A0; }
.ref-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ref-table th { padding: 9px 14px; text-align: left; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-text-muted); font-weight: 500; background: var(--c-bg); border-bottom: 1px solid var(--c-border); }
.ref-table td { padding: 7px 14px; border-bottom: 1px solid var(--c-border-soft); color: var(--c-text-body); font-family: var(--f-body); font-size: 12px; }
.ref-table td.pc { vertical-align: top; border-right: 1px solid var(--c-border); }
.ref-table td.lc { vertical-align: top; border-right: 1px solid var(--c-border); }
.callout { background: var(--c-surface-active); border: 1px solid var(--c-border-active); border-left: 3px solid var(--c-accent); padding: 14px 18px; margin-bottom: 22px; display: flex; align-items: flex-start; gap: 14px; }
.callout-icon  { font-size: 18px; flex-shrink: 0; line-height: 1.4; color: var(--c-accent); font-weight: 900; }
.callout-title { font-family: var(--f-body); font-size: 13px; font-weight: 900; color: var(--c-accent-dark); margin-bottom: 5px; letter-spacing: -0.01em; }
.callout-body  { font-family: var(--f-body); font-size: 12px; color: var(--c-text-body); line-height: 1.55; }
@media(max-width:1100px){.lc-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.lc-grid{grid-template-columns:repeat(2,1fr)}.kw-grid{grid-template-columns:1fr}}
</style>
</head>

// ── NAV ────────────────────────────────────────────────────────────────────
function showPanel(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
}
function showSrc(type, btn) {
  ['auto-grid','manual-grid','pipeline-grid','parked-grid'].forEach(id =>
    document.getElementById(id).classList.add('hidden'));
  document.querySelectorAll('#panel-sources .sub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(type + '-grid').classList.remove('hidden');
  if (btn) btn.classList.add('active');
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function mTag(m) {
  const map = { 'API':'t-api','API POST':'t-api','RSS':'t-rss','RSS + HTML':'t-rss',
    'HTML':'t-html','HTML POST':'t-html','HTML (WordPress)':'t-html','HTML (WP)':'t-html',
    'HTML + RSS':'t-rss','HTML/RSS':'t-rss','Playwright':'t-pw','Manual':'t-man','Unknown (probe)':'t-man' };
  return `<span class="tag ${map[m]||'t-html'}">${m}</span>`;
}
function cTag(c) {
  return `<span class="tag ${c==='daily'?'t-day':c==='weekly'?'t-wk':'t-mon'}">${c}</span>`;
}
function tTag(t) {
  const s = String(t);
  return `<span class="tag ${s.startsWith('1')?'t-t1':s.startsWith('2')?'t-t2':'t-t3'}">T${t}</span>`;
}
function sTag(s) { return s?`<span class="tag t-sig">${s.replace(/_/g,' ')}</span>`:''; }
function card(html) { return `<div class="src-card">${html}</div>`; }

function srcBody(s, badgeCls, badgeLbl) {
  return `
    <div class="src-head">
      <div><div class="src-name">${s.name}</div><div class="src-id">${s.id}</div></div>
      <div class="src-badges"><span class="sbadge ${badgeCls}">${badgeLbl}</span></div>
    </div>
    <div class="src-tags">${mTag(s.method)}${cTag(s.cadence)}${tTag(s.tier)}${sTag(s.signal||'')}</div>
    <div class="src-geo">📍 ${s.geo||''}</div>
    ${s.note?`<div class="src-note">${s.note}</div>`:''}`;
}
